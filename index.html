<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Track your expenses in 3 clicks with BlinkBudget."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="BlinkBudget" />
    <title>BlinkBudget - Fast Expense Tracking</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://blinkbudget-sync.firebaseapp.com" />

    <!-- Load Google Fonts non-render-blocking. Explicit font preloads removed to avoid unused preload warnings. -->
    <link rel="stylesheet" href="/src/styles/critical.css" />

    <!-- Google Fonts loaded non-render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
      />
    </noscript>
    <link
      rel="preload"
      href="/src/styles/main.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      fetchpriority="high"
    />
    <noscript><link rel="stylesheet" href="/src/styles/main.css" /></noscript>
  </head>
  <body>
    <header class="visually-hidden">
      <a href="#app" class="skip-link">Skip to main content</a>
    </header>
    <main id="app">
      <!-- Content injected by main.js -->
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
