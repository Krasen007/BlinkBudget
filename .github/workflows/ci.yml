# CI/CD Pipeline for BlinkBudget
# Runs security audits, quality checks, unit tests, build, and Snyk scan

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Dependency Security Audit ─────────────────────────────────────────────
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Audit Dependencies
        run: yarn npm audit --all

  # ─── Quality Checks (lint, stylelint, prettier, docs) ─────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Checks (lint, stylelint, prettier, validate-docs)
        run: yarn run check

  # ─── Unit Tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Unit Tests
        run: yarn test

  # ─── Production Build ──────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Production Bundle
        run: yarn run build

      - name: Validate Build Output
        run: test -f dist/index.html && echo "✅ Build output verified"

  # ─── Snyk Security Scan (requires SNYK_TOKEN secret) ──────────────────────
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check Snyk Token Configured
        id: snyk-token-check
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if No Token
        if: steps.snyk-token-check.outputs.configured != 'true'
        run: echo "⏭️  SNYK_TOKEN not configured - skipping Snyk scan"

      - name: Checkout
        if: steps.snyk-token-check.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        if: steps.snyk-token-check.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        if: steps.snyk-token-check.outputs.configured == 'true'
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Install Dependencies
        if: steps.snyk-token-check.outputs.configured == 'true'
        run: yarn install --immutable

      - name: Snyk Test (blocking)
        if: steps.snyk-token-check.outputs.configured == 'true'
        # pin to verified release v1.0.0 commit
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Snyk Monitor (continuous monitoring)
        if: steps.snyk-token-check.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        # pin to verified release v1.0.0 commit
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
