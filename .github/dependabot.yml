# Dependabot configuration for BlinkBudget
# Enables automated dependency updates and security alerts

version: 2
updates:
  # npm / Yarn dependencies (production + dev)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Sofia'
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    target-branch: 'master'
    ignore:
      # Vite is pinned via rolldown-vite override - managed manually
      - dependency-name: 'vite'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # Major framework updates require manual review
      - dependency-name: 'firebase'
        update-types: ['version-update:semver-major']
      - dependency-name: 'chart.js'
        update-types: ['version-update:semver-major']

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Sofia'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci(deps)'
      include: 'scope'
    target-branch: 'master'
